# Apache configuration for the n8n-execution-viewer backend.
#
# The static viewer is served by the Alias; only /n8n-viewer/api/ is
# proxied to the backend on 127.0.0.1:8391. Longest-prefix matching makes
# /n8n-viewer/api/ win over the /n8n-viewer rules regardless of order.
#
# TRAP (measured): the target must keep the /api/ path. Apache maps the
# remainder of the URL onto the target, so a bare "http://127.0.0.1:8391/"
# target rewrites /n8n-viewer/api/stats to /stats and the backend 404s.

# --- inside your <VirtualHost> (before any catch-all ProxyPass/ProxyPassMatch) ---
    ProxyPass /n8n-viewer/api/ http://127.0.0.1:8391/api/
    ProxyPassReverse /n8n-viewer/api/ http://127.0.0.1:8391/api/
    ProxyPass /n8n-viewer !
    Alias /n8n-viewer /var/www/n8n-viewer
    <Directory /var/www/n8n-viewer>
        Require ip 192.168.x.x 100.64.0.0/10   # LAN + Tailscale, adapt to yours
    </Directory>

# --- equivalent nginx ---
# location = /n8n-viewer/ { return 301 /n8n-viewer/index.html; }
# location /n8n-viewer/    { alias /var/www/n8n-viewer/; }
# location /n8n-viewer/api/ { proxy_pass http://127.0.0.1:8391/api/; }

# Verify after reload:
#   curl -sk https://your-host/n8n-viewer/api/stats
#   curl -sk -o /dev/null -w "%{http_code}\n" https://your-host/n8n-viewer/app.js   # 200
