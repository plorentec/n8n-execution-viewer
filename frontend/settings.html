<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes · n8n execution viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
  // Apply the saved (or system) theme before painting to avoid a flash.
  (function () {
    try {
      var saved = localStorage.getItem("n8nViewerTheme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.body.classList.add("theme-dark");
    } catch (e) {}
  })();
</script>

<div class="topbar"></div>
<header>
  <div class="brand">
    <svg class="logo" id="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>
    <div class="brand-txt">
      <h1 id="brand-title">Your company</h1>
      <span id="brand-sub">n8n execution viewer</span>
    </div>
  </div>
  <div class="header-right">
    <a class="btn btn-ghost btn-sm" href="index.html" style="text-decoration:none">← Volver al visor</a>
    <a class="btn btn-ghost btn-sm" href="docs.html" target="_blank" rel="noopener" title="Documentación (pestaña nueva)" style="text-decoration:none">Docs</a>
    <button id="logout-btn" class="theme-toggle" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section>
    <h2>Historial</h2>
    <div class="card">
      <label class="lbl" for="cfg-retention">Conservar ejecuciones durante</label>
      <select id="cfg-retention">
        <option value="0">Para siempre</option>
        <option value="30">30 días</option>
        <option value="90">90 días</option>
        <option value="180">180 días</option>
        <option value="365">1 año</option>
        <option value="730">2 años</option>
        <option value="custom">Personalizado…</option>
      </select>
      <input id="cfg-retention-custom" type="number" min="1" max="36500" placeholder="días" class="hidden">
      <p class="hint">Lo anterior a ese plazo se borra del histórico en la próxima sincronización.
      La base de datos de n8n nunca se toca.</p>
    </div>
  </section>

  <section>
    <h2>Marca</h2>
    <div class="card">
      <label class="lbl" for="cfg-title">Título</label>
      <input id="cfg-title" type="text" maxlength="200" placeholder="Tu empresa">
      <label class="lbl" for="cfg-subtitle">Subtítulo</label>
      <input id="cfg-subtitle" type="text" maxlength="200" placeholder="n8n execution viewer">
      <label class="lbl" for="cfg-logo-file">Logo (hasta 2 MB)</label>
      <input id="cfg-logo-file" type="file" accept="image/*">
      <img id="cfg-logo-preview" class="logo-preview" alt="" hidden>
      <button id="cfg-logo-clear" class="btn btn-ghost btn-sm" type="button" hidden>Quitar</button>
      <p class="hint">Dejar un campo vacío vuelve al valor por defecto.</p>
    </div>
    <div class="actions">
      <button id="settings-save" class="btn btn-primary" type="button">Guardar</button>
      <span id="settings-msg" class="msg" aria-live="polite"></span>
    </div>
  </section>

  <section id="sec-users" class="hidden">
    <h2>Usuarios</h2>
    <div class="card">
      <div id="users-list"></div>
      <div class="user-new">
        <input id="user-new-name" type="text" placeholder="usuario" autocomplete="off">
        <input id="user-new-pass" type="password" placeholder="contraseña (min 8)">
        <select id="user-new-role">
          <option value="viewer">Viewer</option>
          <option value="admin">Admin</option>
        </select>
        <button id="user-new-add" class="btn btn-ghost btn-sm" type="button">Añadir</button>
      </div>
      <p class="hint" id="users-msg" aria-live="polite"></p>
    </div>
  </section>

  <section id="sec-totp" class="hidden">
    <h2>Mi 2FA</h2>
    <div class="card">
      <div id="totp-area"></div>
    </div>
  </section>
</main>

<script src="vendor/qrcodegen.js"></script>
<script type="module" src="settings.js"></script>
</body>
</html>
