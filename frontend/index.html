<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='none' stroke='%23f0b400' stroke-width='2'/%3E%3Cpath d='M8 12h8M12 8v8' stroke='%23f0b400' stroke-width='2'/%3E%3C/svg%3E">
  <title>n8n execution viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
  // Apply the saved (or system) theme before painting to avoid a flash.
  (function () {
    try {
      var saved = localStorage.getItem("n8nViewerTheme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.body.classList.add("theme-dark");
    } catch (e) {}
  })();
</script>

<div class="topbar"></div>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>
    <div class="brand-txt">
      <h1>Your company</h1>
      <span>n8n execution viewer</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live"><span class="live-dot" id="live-dot"></span> <span id="live-txt">Cargando…</span></div>
    <button id="sync-btn" class="btn btn-primary btn-sm" type="button" title="Ejecutar el flujo de copia de n8n e integrar la copia nueva en el histórico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/></svg>
      <span id="sync-label">Actualizar ahora</span>
    </button>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat s1">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div class="val" id="st-total">—</div>
      <div class="lbl">Ejecuciones</div>
    </div>
    <div class="stat s2">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a2 2 0 0 1 2 2V14"/></svg></div>
      <div class="val" id="st-workflows">—</div>
      <div class="lbl">Flujos</div>
    </div>
    <div class="stat s3">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg></div>
      <div class="val" id="st-errors">—</div>
      <div class="lbl">Con error</div>
    </div>
    <div class="stat s4">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div class="val" id="st-lost">—</div>
      <div class="lbl" id="st-lost-lbl">Borradas en n8n</div>
    </div>
  </section>

  <form id="filters" class="toolbar">
    <div class="field search">
      <label for="f-q">Buscar</label>
      <input id="f-q" name="q" type="search" placeholder="ID de ejecución o texto dentro de los datos" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-status">Estado</label>
      <select id="f-status" name="status">
        <option value="">Todos</option>
        <option value="success">Correcta</option>
        <option value="error">Error</option>
        <option value="crashed">Caída</option>
        <option value="canceled">Cancelada</option>
        <option value="waiting">En espera</option>
        <option value="running">En curso</option>
      </select>
    </div>
    <div class="field">
      <label for="f-from">Desde</label>
      <input id="f-from" name="from" type="date">
    </div>
    <div class="field">
      <label for="f-to">Hasta</label>
      <input id="f-to" name="to" type="date">
    </div>
    <button type="submit" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar
    </button>
    <button type="button" id="f-clear" class="btn btn-ghost">Limpiar</button>
  </form>

  <div class="layout">
    <aside class="panel workflows">
      <button id="wf-expand" class="wf-rail" type="button" title="Mostrar flujos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        <span>Flujos</span>
      </button>
      <div class="panel-head">
        <h2>Flujos</h2>
        <span class="sub" id="wf-count"></span>
        <button id="wf-collapse" class="icon-btn" type="button" title="Ocultar flujos" aria-label="Ocultar flujos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="panel-search">
        <input id="wf-filter" type="search" placeholder="Filtrar flujos…" autocomplete="off">
      </div>
      <button id="wf-all" class="wf-item all" type="button">
        <span class="wf-name">Todas las ejecuciones</span>
      </button>
      <ul id="wf-list" class="list"></ul>
    </aside>

    <section class="panel executions">
      <div class="panel-head">
        <h2 id="exec-title">Todas las ejecuciones</h2>
        <span class="sub" id="exec-count"></span>
      </div>
      <ul id="exec-list" class="list"></ul>
      <div class="list-foot"><button id="exec-more" class="btn btn-ghost" type="button" hidden>Cargar más</button></div>
    </section>

    <section class="panel detail">
      <div id="detail-empty" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>
        <p>Selecciona una ejecución para ver sus cajas.</p>
      </div>
      <div id="detail" hidden>
        <div class="detail-bar">
          <div class="segmented" role="group" aria-label="Vista">
            <button id="view-list" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              Lista
            </button>
            <button id="view-diagram" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="7" height="7" rx="1.5"/><rect x="15" y="13" width="7" height="7" rx="1.5"/><path d="M9 7.5h3a2 2 0 0 1 2 2v4a2 2 0 0 0 1 1.5"/></svg>
              Diagrama
            </button>
          </div>
          <button id="focus-toggle" class="btn btn-ghost btn-sm" type="button" title="Ampliar (Esc para salir)">
            <svg class="ic-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            <svg class="ic-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
            <span id="focus-label">Ampliar</span>
          </button>
        </div>
        <div id="exec-head" class="exec-head"></div>
        <div id="detail-body" class="detail-body">
          <ol id="node-list" class="nodes"></ol>
          <div id="canvas" class="canvas" hidden>
            <div class="canvas-tools">
              <button id="zoom-in" class="icon-btn" type="button" title="Acercar">+</button>
              <button id="zoom-out" class="icon-btn" type="button" title="Alejar">−</button>
              <button id="zoom-fit" class="icon-btn" type="button" title="Ajustar a la pantalla">⤢</button>
              <button id="zoom-reset" class="icon-btn" type="button" title="Restablecer posiciones de las cajas">↺</button>
            </div>
            <div class="canvas-legend">
              <span><i class="lg success"></i>Correcta</span>
              <span><i class="lg error"></i>Error</span>
              <span><i class="lg idle"></i>No ejecutada</span>
            </div>
          </div>
          <div id="node-panel" class="node-panel"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer>Read-only viewer · permanent history imported from your n8n instance</footer>

<script type="module" src="app.js"></script>
</body>
</html>
